name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libfontconfig1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 plugin
        run: cmake --build build --target NES_EQ_VST3 --config Release -j 2

      - name: Build AU plugin (macOS only)
        if: runner.os == 'macOS'
        run: cmake --build build --target NES_EQ_AU --config Release -j 2

      - name: Build tests
        run: cmake --build build --target NES_EQ_Tests --config Release -j 2

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release
